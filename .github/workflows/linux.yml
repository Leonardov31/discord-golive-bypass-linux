name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Testar e analisar
        run: ./fedora/build.sh test
      - name: Compilar Linux
        run: ./fedora/build.sh
      - name: Validar scripts
        run: bash -n fedora/build.sh fedora/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: discord-golive-bypass-linux-amd64
          path: build/discord-golive-bypass
